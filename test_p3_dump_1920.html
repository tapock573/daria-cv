<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<iframe id="f" src="index.html?lang=en" style="width: 1920px; height: 5000px;"></iframe>
<pre id="out">Project 1: Strat&lt;span class="italic-glyph"&gt;e&lt;/span&gt;gy | top=5205 | lines=1
Project 2: UX | top=6085 | lines=1
Project 3: V&lt;span class="italic-glyph"&gt;is&lt;/span&gt;ual&lt;br class="br-1920"&gt; design | top=6965 | lines=1
Project 4: AI &amp;amp; cr&lt;span class="italic-glyph"&gt;eat&lt;/span&gt;ive | top=7845 | lines=1</pre>
<script>
window.onload = function() {
  setTimeout(function() {
    const f = document.getElementById('f');
    const doc = f.contentDocument;
    const titles = Array.from(doc.querySelectorAll('.project-title'));
    const res = titles.map((t, i) => {
      const rect = t.getBoundingClientRect();
      return 'Project ' + (i+1) + ': ' + t.innerHTML.replace(/\s+/g, ' ') + ' | top=' + Math.round(rect.top) + ' | lines=' + t.getClientRects().length;
    });
    document.getElementById('out').textContent = res.join('\n');
  }, 1000);
};
</script>


</body></html>
